name: release

# Triggers:
#  - Push a tag like `v0.1.0` → builds bundles for every platform, opens a
#    draft GitHub Release with the artifacts attached.
#  - Manual dispatch → same, useful for dry runs (won't publish).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without creating a release"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary (Apple silicon + Intel).
          #- os: macos-latest
          #  target: universal-apple-darwin
          #  label: macos
          - os: ubuntu-22.04
            target: ""
            label: linux-x86_64
          - os: windows-latest
            target: ""
            label: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS needs both targets so Tauri can lipo them together.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build & bundle via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (set these in repo secrets to enable):
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          releaseName: "ReadUp ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}"
          releaseBody: |
            See the changelog for details.

            **Downloads**
            - macOS: `.dmg`
            - Linux: `.deb`, `.rpm`, `.AppImage`
            - Windows: `.msi`, NSIS `.exe`
          releaseDraft: true
          prerelease: false
          # Skip release creation for manual dry-run dispatches.
          updaterJsonPreferNsis: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload artifacts (always, even on dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readup-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
